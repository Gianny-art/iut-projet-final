{% extends 'base_v2.html' %}
{% block content %}
<div class="px-4">
  <div class="card text-center py-8" id="statusCard">
    <div id="iconPending" class="{{ '' if payment['status']=='PENDING' else 'hidden' }}">
      <i class="fas fa-clock text-4xl text-[var(--gold)] mb-3 animate-pulse"></i>
      <h2 class="text-xl font-bold">Paiement en attente</h2>
    </div>
    <div id="iconSuccess" class="{{ '' if payment['status'] in ('FINISHED','SUCCESSFUL') else 'hidden' }}">
      <i class="fas fa-circle-check text-4xl text-[var(--success)] mb-3"></i>
      <h2 class="text-xl font-bold">Dépôt confirmé !</h2>
    </div>
    <div id="iconFailed" class="{{ '' if payment['status'] in ('FAILED','REJECTED') else 'hidden' }}">
      <i class="fas fa-circle-xmark text-4xl text-red-400 mb-3"></i>
      <h2 class="text-xl font-bold">Paiement échoué</h2>
    </div>

    <p class="text-sm text-[var(--text-muted)] mt-2">Référence : <span class="font-mono">{{ payment['provider_tx_id'] }}</span></p>
    <p class="text-2xl font-bold mt-3">{{ payment['amount'] }} F</p>

    <div class="flex gap-2 justify-center mt-6">
      <a href="{{ url_for('index') }}" class="btn btn-outline">Accueil</a>
      <a href="{{ url_for('deposit_page') }}" class="btn btn-gold">Nouveau dépôt</a>
    </div>
  </div>
</div>

{% if payment['status'] == 'PENDING' %}
<script>setInterval(() => location.reload(), 4000);</script>
{% endif %}
{% endblock %}
