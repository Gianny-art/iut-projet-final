{% extends 'base_v2.html' %}
{% block content %}
<div class="min-h-[75vh] px-4 flex flex-col justify-center">
  <div class="card max-w-md mx-auto w-full">
    <div class="text-center mb-6">
      <i class="fas fa-shield-halved text-3xl text-[var(--gold)] mb-2"></i>
      <h2 class="text-2xl font-bold mb-1">Bienvenue</h2>
      <p class="text-[var(--text-muted)] text-sm">Connecte-toi pour continuer sur ManyBet</p>
    </div>

    {% if error %}
    <div class="bg-red-500/10 border border-red-500/40 text-red-300 p-3 rounded-lg mb-5 text-sm flex items-center gap-2">
      <i class="fas fa-exclamation-circle"></i><span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input name="username" required class="form-input" placeholder="Ton nom d'utilisateur">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input name="password" type="password" required class="form-input" placeholder="Ton mot de passe">
      </div>
      <button class="btn btn-gold w-full" type="submit">Se connecter <i class="fas fa-arrow-right ml-2"></i></button>
    </form>

    <div class="mt-6 text-center text-sm">
      <span class="text-[var(--text-muted)]">Pas encore de compte ?</span>
      <a href="{{ url_for('register') }}" class="text-[var(--gold)] font-medium">Inscris-toi</a>
    </div>
  </div>
</div>
{% endblock %}
